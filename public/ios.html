<html>
  <head>
    <meta charset='utf-8'>
    <title>iOS test keyboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Testing in online browser
    https://www.browserling.com/browse/ios18/safari18/https://wolispace.com/cowdee/ios.html
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: none;
        overscroll-behavior: none;
        background-color: rgb(49, 47, 49);
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      #app {
        position: fixed;
        top: var(--vv-top, 0px);
        height: var(--vv-height, 100dvh);
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #top {
        background-color: rgb(35, 35, 58);
      }

      input, select, textarea {
        font-size: 16px;
      }

      .footer {
        position: fixed;
        bottom: 0;
        width: 100%;
      }

      input {
        width: 100%;
      } 
    </style>
    <script>
      let syncTimer;
    function syncViewport() {
      const vv = window.visualViewport;
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
      if (!vv && !isIOS) return;
      document.documentElement.style.setProperty('--vv-top', `${vv.offsetTop}px`);
      document.documentElement.style.setProperty('--vv-height', `${vv.height}px`);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
      syncViewport();
    }

    </script>
  </head>
  <body>
    <div id="app">
      <h1>Top line v3</h1>
      <div id="top">
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
        <p>7</p>
        <p>8</p>
        <p>9</p>
        <p>10</p>
        <p>11</p>
        <p>12</p>
      </div>
      <div class="footer">
        <input type="text" placeholder="Click in here to open your keyboard">
      </div>
    </div>
  </body>
</html>
